services:
  naruto-chat-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: naruto-chat-bot
    restart: unless-stopped
    env_file:
      - .env
    ports:
      # Web admin: reachable from this machine only. Use an SSH tunnel for
      # remote access (ssh -L 8765:127.0.0.1:8765 server).
      - "127.0.0.1:8765:8765"
    volumes:
      - naruto-data:/data
      # Optional, read once on first start to seed the database. Create the
      # files before uncommenting (Docker creates a directory otherwise).
      # - ./config.json:/app/config.json:ro
      # - ./system_prompt.md:/app/system_prompt.md:ro

volumes:
  naruto-data:
